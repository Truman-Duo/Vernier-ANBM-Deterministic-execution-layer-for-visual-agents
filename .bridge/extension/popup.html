<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 440px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      color: #1a1a2e;
      background: #f8f9fa;
      padding: 12px;
    }
    h1 { font-size: 16px; font-weight: 700; margin-bottom: 2px; }
    .subtitle { font-size: 11px; color: #6b7280; margin-bottom: 10px; }

    .status-bar {
      display: flex; align-items: center; gap: 6px;
      padding: 6px 10px; border-radius: 6px; margin-bottom: 8px; font-size: 12px;
    }
    .status-bar.online { background: #d1fae5; color: #065f46; }
    .status-bar.offline { background: #fee2e2; color: #991b1b; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; }
    .status-dot.online { background: #10b981; }
    .status-dot.offline { background: #ef4444; }

    .section {
      background: white; border-radius: 8px; padding: 10px;
      margin-bottom: 8px; border: 1px solid #e5e7eb;
    }
    .section-title {
      font-size: 11px; font-weight: 600; color: #374151;
      margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px;
    }

    .form-row { display: flex; gap: 6px; margin-bottom: 6px; align-items: center; }
    input, select {
      flex: 1; padding: 5px 8px; border: 1px solid #d1d5db;
      border-radius: 4px; font-size: 12px; font-family: inherit;
    }
    input:focus, select:focus { outline: none; border-color: #6366f1; }
    select { min-width: 0; }

    button {
      padding: 5px 10px; border: none; border-radius: 4px;
      font-size: 12px; font-weight: 500; cursor: pointer; font-family: inherit; white-space: nowrap;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-primary { background: #6366f1; color: white; }
    .btn-primary:hover:not(:disabled) { background: #4f46e5; }
    .btn-secondary { background: #e5e7eb; color: #374151; }
    .btn-secondary:hover:not(:disabled) { background: #d1d5db; }
    .btn-success { background: #10b981; color: white; }
    .btn-success:hover:not(:disabled) { background: #059669; }
    .btn-danger { background: #ef4444; color: white; }
    .btn-sm { padding: 3px 8px; font-size: 11px; }
    .btn-row { display: flex; gap: 5px; margin-top: 6px; flex-wrap: wrap; }

    .log-area {
      background: #1e1e2e; color: #cdd6f4;
      font-family: "Fira Code", "Cascadia Code", "Consolas", monospace;
      font-size: 10px; padding: 8px; border-radius: 6px;
      max-height: 180px; overflow-y: auto; white-space: pre-wrap; word-break: break-all;
    }
    .log-ok { color: #a6e3a1; }
    .log-err { color: #f38ba8; }
    .log-info { color: #89b4fa; }
    .log-warn { color: #f9e2af; }

    .badge {
      display: inline-block; padding: 1px 6px; border-radius: 3px;
      font-size: 10px; font-weight: 600;
    }
    .badge-ok { background: #d1fae5; color: #065f46; }
    .badge-fail { background: #fee2e2; color: #991b1b; }
    .badge-warn { background: #fef3c7; color: #92400e; }

    .adapter-list { max-height: 160px; overflow-y: auto; }
    .adapter-item {
      padding: 3px 6px; border-radius: 4px; cursor: pointer;
      display: flex; justify-content: space-between; align-items: center;
      font-size: 11px;
    }
    .adapter-item:hover { background: #f3f4f6; }
    .adapter-item.selected { background: #eef2ff; color: #4338ca; }
    .adapter-item.batch-queued { background: #fef3c7; }

    .batch-progress {
      height: 4px; background: #e5e7eb; border-radius: 2px; margin-top: 4px; overflow: hidden;
    }
    .batch-progress-fill {
      height: 100%; background: #6366f1; border-radius: 2px; transition: width 0.3s;
    }
  </style>
</head>
<body>

<h1>ANBM Bridge <span style="font-size:10px;color:#9ca3af;">v2</span></h1>
<div class="subtitle">自动验证 & 批量扫描 · adapter 新鲜度检查</div>

<div id="statusBar" class="status-bar offline">
  <span id="statusDot" class="status-dot offline"></span>
  <span id="statusText">检查连接...</span>
</div>

<!-- Section 1: Scan -->
<div class="section">
  <div class="section-title">扫描页面</div>
  <div class="form-row">
    <select id="adapterSelect" style="flex:2">
      <option value="">-- 选择或自动检测 --</option>
    </select>
    <input type="text" id="adapterId" placeholder="或手动输入" style="flex:1">
  </div>
  <div class="form-row">
    <select id="stateSelect">
      <option value="">自动检测状态</option>
    </select>
  </div>
  <div class="btn-row">
    <button class="btn-primary" id="btnScan">扫描当前页</button>
    <button class="btn-success" id="btnVerify">验证此 Adapter</button>
  </div>
  <div class="form-row" style="margin-top:6px">
    <input type="text" id="selectorInput" placeholder="快速测试 CSS selector" value="">
    <button class="btn-sm btn-secondary" id="btnQuickTest">测试</button>
  </div>
</div>

<!-- Section 2: Batch Scan -->
<div class="section">
  <div class="section-title">批量扫描</div>
  <div style="font-size:11px;color:#6b7280;margin-bottom:4px;" id="batchStatus">就绪</div>
  <div class="batch-progress" id="batchProgressBar" style="display:none">
    <div class="batch-progress-fill" id="batchProgressFill" style="width:0%"></div>
  </div>
  <div class="btn-row">
    <button class="btn-success btn-sm" id="btnBatchScan">扫描未验证 adapter</button>
    <button class="btn-danger btn-sm" id="btnStopBatch" style="display:none">停止</button>
  </div>
  <div class="adapter-list" id="batchList" style="margin-top:4px;"></div>
</div>

<!-- Log -->
<div class="section">
  <div class="section-title">日志</div>
  <div class="log-area" id="logArea">
    <div class="log-info">[v2] 就绪</div>
  </div>
  <button class="btn-sm btn-secondary" id="btnClearLog" style="margin-top:4px;">清空</button>
  <button class="btn-sm btn-secondary" id="btnUploadLog" style="margin-top:4px;">上传日志给 Claude</button>
</div>

<script src="popup.js"></script>
</body>
</html>
